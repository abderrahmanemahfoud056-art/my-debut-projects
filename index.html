<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Match Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Color Match Game</h1>
    <hr />
    <br />
    <div id="score">Score: 0</div>
    <div id="target-color" class="target-color"></div>
    <br />
    <div class="button-container">
      <button id="red-btn" class="color-btn" style="background-color: red">
        Red
      </button>
      <button id="blue-btn" class="color-btn" style="background-color: blue">
        Blue
      </button>
      <button id="green-btn" class="color-btn" style="background-color: green">
        Green
      </button>
      <button
        id="yellow-btn"
        class="color-btn"
        style="background-color: yellow; color: black"
      >
        Yellow
      </button>
      <button
        id="purple-btn"
        class="color-btn"
        style="background-color: purple"
      >
        Purple
      </button>
      <button
        id="orange-btn"
        class="color-btn"
        style="background-color: orange"
      >
        Orange
      </button>
    </div>
    <br />
    <button id="reset-btn">Reset Score</button>
    <script src="script.js"></script>
  </body>
</html>
